[build-system]
# Pinned: an unpinned backend changes artifact metadata without a code change
# (hatchling 1.32 silently moved to Metadata-Version 2.5, which only twine>=7 /
# gh-action-pypi-publish>=1.14.2 can upload).
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "create-context-graph"
version = "0.14.0"
description = "Interactive CLI scaffolding tool for domain-specific context graph applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "William Lyon" },
]
keywords = ["neo4j", "context-graph", "ai-agent", "scaffolding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
# Floors are the versions the suite is tested against; caps sit at the next
# major so an upstream major release cannot be pulled in untested. The lock is
# the source of truth for CI (`uv sync --locked`); refresh it with `uv lock
# --upgrade` monthly and on security advisories, and always commit it whole.
dependencies = [
    "click>=8.2,<9",
    "questionary>=2.1,<3",
    "rich>=14,<16",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.2,<7",
    "pydantic>=2.12,<3",
    # Driver 6.x has been the locked version since 2026-01; every API used
    # survives the 6.0 removals (see DEPENDENCY_UPGRADE_PLAN.md §4.2).
    "neo4j>=6.1,<7",
]

[project.optional-dependencies]
generate = [
    # anthropic 1.x / openai 3.x moved from httpx to httpx2; no code passes
    # httpx objects to either SDK, so the majors are drop-in here.
    "anthropic>=1.0,<2",
    "openai>=2.0,<4",
]
ingest = [
    # The CLI ingest path only writes fixture entities and never runs the
    # local extraction pipeline, so the [spacy,gliner] extras (torch + CUDA,
    # ~4 GB on Linux) are not needed. [nams] declares httpx for the hosted
    # backend. 0.5.0 is the first release exposing NamsConfig/ontology/query;
    # <0.6.0 guards the announced removal of `client.graph`.
    "neo4j-agent-memory[nams]>=0.5.0,<0.6.0",
]
connectors = [
    "PyGithub>=2.6,<3",
    "notion-client>=3.0,<4",
    # 4.0 is the first release that can reach Jira Cloud's /search/jql.
    "atlassian-python-api>=4.0,<6",
    "slack-sdk>=3.20,<4",
    "google-api-python-client>=2.150,<3",
    "google-auth-oauthlib>=1.2.4,<2",
    "simple-salesforce>=1.12.6,<2",
    # local-file connector — document parsers (all MIT / BSD / Apache-2).
    "markdown-it-py>=4.0,<5",
    "mdit-py-plugins>=0.5,<1",
    # Pre-1.0: page_count() removal is scheduled for 0.4.0.
    "pdf-oxide>=0.3.77,<0.4",
    "pypdf>=6.17,<7",
    "pdfplumber>=0.11.10,<0.12",
    "beautifulsoup4>=4.14,<5",
    "lxml>=6.1.3,<8",
    "python-docx>=1.2,<2",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "pytest-asyncio>=1.0,<2",
    # Runtime deps the generated project uses — required for route integration tests
    # (tests/test_routes_integration.py mounts the generated FastAPI app).
    "fastapi>=0.137",
    # Starlette's TestClient prefers httpx2 (warns when only httpx is present).
    "httpx2>=2.7",
    "pydantic-settings>=2.14.2,<3",
    # Pinned so local `make lint` and CI enforce the same rules — an unpinned
    # ruff broke CI when 0.16 expanded its default rule set.
    "ruff>=0.16,<0.17",
]
all = [
    "create-context-graph[generate,ingest,connectors]",
]

[project.scripts]
create-context-graph = "create_context_graph.cli:main"

[project.urls]
Homepage = "https://github.com/neo4j-labs/create-context-graph"
Repository = "https://github.com/neo4j-labs/create-context-graph"

[tool.hatch.build.targets.wheel]
packages = ["src/create_context_graph"]

[tool.uv]
# Keep the lock author, CI and contributors on the same resolver line.
required-version = ">=0.11.29,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (run with --slow)",
    "integration: marks tests requiring Neo4j (run with --integration)",
    "functional: marks functional tests that ingest realistic on-disk fixtures (run with --functional)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the enforced rule set explicitly. Ruff 0.16 expanded its default rule
# selection, which silently changed what CI lints and broke the build — an
# unpinned selection means upstream releases decide our standards. This is
# the pre-0.16 default set the codebase is written against; expand it
# deliberately (one rule family at a time), not via default drift.
select = ["E4", "E7", "E9", "F"]
